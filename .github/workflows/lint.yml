name: lint

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: bash -n setup-openclaw-lxc.sh
      - name: ShellCheck (host script)
        run: shellcheck setup-openclaw-lxc.sh
      - name: ShellCheck (embedded in-container provisioning script)
        run: |
          sed -n "/^cat > \"\$WORKDIR\/provision.sh\" <<'PROVISION'/,/^PROVISION\$/p" setup-openclaw-lxc.sh \
            | sed '1d;$d' > /tmp/provision.sh
          test -s /tmp/provision.sh
          shellcheck /tmp/provision.sh
