<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">OpenClaw on Proxmox</title>
  <desc id="d">One script that deploys an OpenClaw AI assistant with a remote desktop in a Proxmox LXC container.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <circle cx="1060" cy="60" r="180" fill="#6366f1" opacity="0.12"/>
  <circle cx="1130" cy="290" r="140" fill="#f97316" opacity="0.10"/>

  <!-- terminal window -->
  <g transform="translate(760 70)">
    <rect width="380" height="180" rx="12" fill="#0b1020" stroke="#334155"/>
    <circle cx="20" cy="20" r="6" fill="#ef4444"/>
    <circle cx="40" cy="20" r="6" fill="#eab308"/>
    <circle cx="60" cy="20" r="6" fill="#22c55e"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
      <text x="20" y="62" fill="#94a3b8">$ ./setup-openclaw-lxc.sh</text>
      <text x="20" y="90" fill="#38bdf8">[3/6] Creating the container</text>
      <text x="20" y="114" fill="#38bdf8">[5/6] Provisioning the container</text>
      <text x="20" y="146" fill="#4ade80">✔ OpenClaw is ready</text>
    </g>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="60" y="130" font-size="54" font-weight="800" fill="#f8fafc">OpenClaw</text>
    <text x="60" y="190" font-size="54" font-weight="800" fill="url(#accent)">on Proxmox</text>
    <text x="60" y="235" font-size="22" fill="#cbd5e1">One script. A private AI assistant with its own desktop.</text>
    <g font-size="15" font-weight="600">
      <rect x="60" y="260" width="120" height="30" rx="15" fill="#1e293b" stroke="#475569"/>
      <text x="120" y="280" text-anchor="middle" fill="#e2e8f0">Debian 13 LXC</text>
      <rect x="192" y="260" width="130" height="30" rx="15" fill="#1e293b" stroke="#475569"/>
      <text x="257" y="280" text-anchor="middle" fill="#e2e8f0">LXQt + noVNC</text>
      <rect x="334" y="260" width="120" height="30" rx="15" fill="#1e293b" stroke="#475569"/>
      <text x="394" y="280" text-anchor="middle" fill="#e2e8f0">Unprivileged</text>
    </g>
  </g>
</svg>
